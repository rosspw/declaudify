name: New tell or Claudish term
description: A sign of AI writing, or a Claudish expression, that the skill misses
title: "Tell: "
labels: [tell]
body:
  - type: textarea
    id: example
    attributes:
      label: The sentence where it appeared
      description: Paste the real sentence. Say which model or agent wrote it if you know.
    validations:
      required: true
  - type: input
    id: plain
    attributes:
      label: What it means in plain English
    validations:
      required: true
  - type: dropdown
    id: tier
    attributes:
      label: How sure are you it is a tell on its own?
      options: [One sighting is enough, Only when it clusters with others, Only with company]
